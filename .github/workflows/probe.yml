name: Probe data source

on:
  push:
    branches: [main]
    paths:
      - "pipeline/scripts/probe_alpha_vantage.py"

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python pipeline/scripts/probe_alpha_vantage.py
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/av-probe.json
          git commit -m "Alpha Vantage probe result [skip ci]" || echo "No change"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
