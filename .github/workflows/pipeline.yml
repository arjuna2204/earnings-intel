name: Data pipeline

on:
  # Started by the website when you analyze a ticker.
  workflow_dispatch:
    inputs:
      command:
        description: "analyze | tickers | refresh"
        required: true
        default: analyze
      ticker:
        description: "Ticker (for analyze)"
        required: false
      job_id:
        description: "Job row id created by the website"
        required: false
  # Daily at 6:17am Eastern (11:17 UTC): refresh ticker list, filings, financials and prices. No AI.
  schedule:
    - cron: "17 11 * * *"

concurrency:
  group: pipeline-${{ inputs.ticker || 'daily' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - name: Analyze ticker
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'analyze'
        working-directory: pipeline
        run: python -m ei.cli analyze "${{ inputs.ticker }}" ${{ inputs.job_id && format('--job-id {0}', inputs.job_id) || '' }}
      - name: Refresh ticker list
        if: github.event_name == 'schedule' || inputs.command == 'tickers'
        working-directory: pipeline
        run: python -m ei.cli tickers
      - name: Refresh tracked companies
        if: github.event_name == 'schedule' || inputs.command == 'refresh'
        working-directory: pipeline
        run: python -m ei.cli refresh
