name: Data pipeline

on:
  # Started by the website when you analyze a ticker.
  workflow_dispatch:
    inputs:
      command:
        description: "daily | analyze | calls | brief | peers | backtest | dcf | tickers | refresh | autoload | coverage | risk-options | retry-deferred"
        required: true
        default: analyze
      ticker:
        description: "Ticker (for analyze)"
        required: false
      job_id:
        description: "Job row id created by the website"
        required: false
      period_a:
        description: "First quarter for calls, e.g. FY2025Q4"
        required: false
      period_b:
        description: "Second quarter for calls, e.g. FY2026Q4"
        required: false
      peer_set:
        description: "Peers: comma-separated tickers (edited list) or auto:N to re-pick N peers"
        required: false
  # Lets Claude queue a run by committing ops/run.json, e.g. {"command": "analyze", "ticker": "AAPL"}.
  push:
    branches: [main]
    paths:
      - "ops/run.json"
  # Daily at 6:17am Eastern (11:17 UTC): refresh ticker list, filings, financials and prices. No AI.
  schedule:
    - cron: "17 11 * * *"
    # Every 6 hours: resume loads paused by a free-tier limit (exits in seconds if none; each run bills a minute).
    - cron: "41 */6 * * *"

# contents: the workflow commits refreshed files; actions: a run-file "daily" request starts the full daily run
permissions:
  contents: write
  actions: write

concurrency:
  group: pipeline-${{ inputs.ticker || github.event_name }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CBOE_DATA: ${{ secrets.CBOE_DATA }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline[embeddings]"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Analyze calls
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'calls'
        working-directory: pipeline
        env:
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: python -m ei.cli calls "${{ inputs.ticker }}" "${{ inputs.period_a }}" "${{ inputs.period_b }}" ${{ inputs.job_id && format('--job-id {0}', inputs.job_id) || '' }}
      - name: Compare with peers
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'peers'
        working-directory: pipeline
        env:
          PEER_SET: ${{ inputs.peer_set }}
          TICKER: ${{ inputs.ticker }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          ARGS=()
          [ -n "$JOB_ID" ] && ARGS+=(--job-id "$JOB_ID")
          case "$PEER_SET" in
            auto:*) ARGS+=(--n "${PEER_SET#auto:}") ;;
            "") ;;
            *) ARGS+=(--set "$PEER_SET") ;;
          esac
          python -m ei.cli peers "$TICKER" "${ARGS[@]}"
      - name: Write brief
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'brief'
        working-directory: pipeline
        env:
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: python -m ei.cli brief "${{ inputs.ticker }}" "${{ inputs.period_a }}" "${{ inputs.period_b }}" ${{ inputs.job_id && format('--job-id {0}', inputs.job_id) || '' }}
      - name: Run request file
        if: github.event_name == 'push'
        working-directory: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CMD=$(python -c "import json;print(json.load(open('../ops/run.json'))['command'])")
          if [ "$CMD" = "daily" ]; then
            # the full daily update has many steps; start it as its own run
            gh workflow run pipeline.yml --ref main -f command=daily
          elif [ "$CMD" = "calls" ] || [ "$CMD" = "brief" ]; then
            ARGS=$(python -c "import json;d=json.load(open('../ops/run.json'));print(d['ticker'], *d['periods'])")
            FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed python -m ei.cli $CMD $ARGS
          elif [ "$CMD" = "analyze" ]; then
            for T in $(python -c "import json;d=json.load(open('../ops/run.json'));print(' '.join(d.get('tickers') or [d['ticker']]))"); do
              python -m ei.cli analyze "$T" $(python -c "import json;print(' '.join(json.load(open('../ops/run.json')).get('args', [])))") || echo "::warning::analyze $T failed"
            done
          else
            TICKERS=$(python -c "import json;d=json.load(open('../ops/run.json'));print(' '.join(d.get('tickers') or [d.get('ticker') or '-']))")
            for T in $TICKERS; do
              [ "$T" = "-" ] && T=""
              EXTRA=$(python -c "import json;print(' '.join(json.load(open('../ops/run.json')).get('args', [])))")
              FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed python -m ei.cli "$CMD" $T $EXTRA || echo "::warning::$CMD $T failed"
            done
          fi
      - name: Analyze ticker
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'analyze'
        working-directory: pipeline
        run: python -m ei.cli analyze "${{ inputs.ticker }}" ${{ inputs.job_id && format('--job-id {0}', inputs.job_id) || '' }}
      - name: Daily run started
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: |
          python -m ei.cli daily-mark running ${{ inputs.job_id || '' }} || true
      - name: Refresh ticker list
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'tickers'
        working-directory: pipeline
        run: |
          python -m ei.cli tickers || echo "::warning::ticker list refresh failed"
      - name: Refresh tracked companies (only what changed; no Alpha Vantage)
        id: refresh
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'refresh'
        working-directory: pipeline
        run: |
          python -m ei.cli refresh || echo "::warning::refresh failed"
      - name: Rank all stocks by size and load the next 10 largest (free)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'autoload'
        working-directory: pipeline
        run: |
          python -m ei.cli universe || echo "::warning::size ranking failed"
          python -m ei.cli autoload --n 10 || echo "::warning::autoload failed"
      - name: Upcoming earnings dates (1 Alpha Vantage request)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'earnings-calendar'
        working-directory: pipeline
        run: |
          # report dates are announced on business days; weekends keep the request for Street data
          if [ "$(TZ=America/New_York date +%u)" -le 5 ] || [ "${{ inputs.command }}" = "earnings-calendar" ]; then
            python -m ei.cli earnings-calendar || echo "::warning::earnings calendar refresh failed"
          else
            echo "Weekend: earnings calendar unchanged, skipped"
          fi
      - name: Street data and latest call, biggest companies first (Alpha Vantage)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'coverage'
        working-directory: pipeline
        env:
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: |
          python -m ei.cli coverage || echo "::warning::coverage stopped early"
      - name: Institutional holders when the SEC publishes a new quarter (free, no AI)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'ownership'
        working-directory: pipeline
        run: |
          # insider trades are picked up during the refresh step (only companies with new Form 4s)
          if [ "${{ inputs.command }}" = "ownership" ]; then python -m ei.cli insiders || echo "::warning::insider refresh failed"; fi
          python -m ei.cli holders || echo "::warning::13F holders refresh failed"  # downloads only when the SEC publishes a new quarter
      - name: Sector growth and DCFs, after a new trading day (free, no AI)
        if: (((github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily') && steps.refresh.outputs.new_trading_day == 'true') || inputs.command == 'dcf'
        working-directory: pipeline
        run: |
          python -m ei.cli sector-growth || echo "::warning::sector growth refresh failed; DCFs use the last saved rates"
          python -m ei.cli dcf || echo "::warning::dcf failed"
      - name: Options, after a new trading day (free, no AI)
        if: (((github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily') && steps.refresh.outputs.new_trading_day == 'true') || inputs.command == 'risk-options'
        working-directory: pipeline
        run: |
          python -m ei.cli options || echo "::warning::options refresh failed"
      - name: Sector check, and risk stats that are missing or older than the latest prices (free, no AI)
        # by staleness, not this run's "new trading day": the price catch-up run often loads the new day first
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'risk-options'
        working-directory: pipeline
        run: |
          python -m ei.cli fix-sectors || echo "::warning::sector check failed"
          python -m ei.cli risk --stale || echo "::warning::risk stats refresh failed"
      - name: Write the brief and call comparison for companies that just reported (AI, budget-capped)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'auto-research'
        working-directory: pipeline
        # Batched AI calls (half price) take a few minutes each; companies start for 40 min and each may take 30.
        timeout-minutes: 78
        # if this step runs out of time, the free data steps below still run
        continue-on-error: true
        run: FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed timeout --signal=INT 74m python -m ei.cli auto-research || echo "::warning::auto research stopped early"
      - name: Basic data for the 500 largest companies (prices daily, financials Sundays; free, no AI)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: python -m ei.cli lite || echo "::warning::basic-data refresh failed"
      - name: Post-earnings recaps (free, no AI)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: python -m ei.cli recap || echo "::warning::recaps failed"
      - name: Company events from new 8-Ks (free, no AI)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: python -m ei.cli events || echo "::warning::events failed"
      - name: Customers and suppliers from new 10-Ks (about 1 cent of AI per new 10-K)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: python -m ei.cli supply || echo "::warning::supply chain failed"
      - name: Executive pay and 5% holders, new filings only (free, no AI)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: python -m ei.cli proxy || echo "::warning::proxy/13D-G failed"
      - name: Short interest from FINRA (free; new data twice a month)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: python -m ei.cli short-interest || echo "::warning::short interest failed"
      - name: Macro data from FRED (Treasury, NY Fed, BLS, Cboe; free, no key)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: python -m ei.cli macro || echo "::warning::macro failed"
      - name: Data-quality checks (free, no AI; about 1 minute)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: python -m ei.cli quality || echo "::warning::quality checks failed"
      - name: Backtest, weekly on Sundays (free, no AI)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily' || inputs.command == 'backtest'
        working-directory: pipeline
        env:
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: |
          # weekly (Sundays): results barely move day to day
          if [ "$(TZ=America/New_York date +%u)" = "7" ] || [ "${{ inputs.command }}" = "backtest" ]; then
            python -m ei.cli backtest-collect --max-annual 120 || echo "::warning::backtest collection stopped early"
            python -m ei.cli backtest-run || echo "::warning::backtest run failed"
          else
            echo "Backtest runs on Sundays; skipped"
          fi
      - name: Daily run finished
        if: (github.event_name == 'schedule' && github.event.schedule == '17 11 * * *') || inputs.command == 'daily'
        working-directory: pipeline
        run: |
          python -m ei.cli daily-mark done ${{ inputs.job_id || '' }} || true
      - name: Retry paused loads
        if: (github.event_name == 'schedule' && github.event.schedule == '41 */6 * * *') || inputs.command == 'retry-deferred'
        working-directory: pipeline
        run: python -m ei.cli retry-deferred
