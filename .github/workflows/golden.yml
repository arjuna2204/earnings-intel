name: Save golden fixture

# Saves a stored call comparison (derived data only) for UI checks and regression tests.
# Triggered by committing ops/golden.json, e.g. {"ticker": "AAPL", "periods": ["FY2025Q4", "FY2026Q4"]}.
on:
  push:
    branches: [main]
    paths:
      - "ops/golden.json"

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - name: Dump
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          ARGS=$(python -c "import json;d=json.load(open('ops/golden.json'));print(d['ticker'], *d['periods'])")
          python pipeline/scripts/dump_calls_fixture.py $ARGS
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/tests/fixtures/golden
          git commit -m "Save golden call fixture [skip ci]" || echo "No change"
          git pull --rebase origin main
          git push origin HEAD:main
