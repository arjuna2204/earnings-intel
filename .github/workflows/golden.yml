name: Save golden fixture

# Saves a stored call comparison (derived data only) for UI checks and regression tests.
# Triggered by committing ops/golden.json, e.g. {"ticker": "AAPL", "periods": ["FY2025Q4", "FY2026Q4"]}.
on:
  push:
    branches: [main]
    paths:
      - "ops/golden.json"

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e pipeline
      - name: Dump
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if python -c "import json,sys;sys.exit(0 if 'eval' in json.load(open('ops/golden.json')) else 1)"; then
            python pipeline/scripts/dump_eval_fixture.py $(python -c "import json;print(' '.join(json.load(open('ops/golden.json'))['eval']))")
          else
            ARGS=$(python -c "import json;d=json.load(open('ops/golden.json'));print(d['ticker'], *d['periods'])")
            python pipeline/scripts/dump_calls_fixture.py $ARGS
          fi
      - name: Save result
        run: |
          echo "::warning::files: $(ls -la pipeline/tests/fixtures/golden 2>&1 | tail -n +2 | tr '\n' ' ')"
          echo "::warning::status: $(git status --porcelain 2>&1 | head -8 | tr '\n' ' ')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p pipeline/tests/fixtures/eval && git add pipeline/tests/fixtures/golden pipeline/tests/fixtures/eval || { echo "::error::git add failed"; exit 1; }
          git commit -m "Save golden call fixture [skip ci]" || echo "No change"
          git pull --rebase --autostash origin main || { echo "::error::pull failed: $(git status --porcelain | head -5 | tr '\n' ' ')"; exit 1; }
          git push origin HEAD:main || { echo "::error::push failed"; exit 1; }
